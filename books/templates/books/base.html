<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>{% block title %}Book Management{% endblock %}</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        nav {
            background: #1f2937;
            padding: 16px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 18px;
        }

        .brand {
            font-size: 21px;
            font-weight: bold;
        }

        .container {
            width: 86%;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 24px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .button {
            display: inline-block;
            background: #2563eb;
            color: white;
            padding: 10px 16px;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            cursor: pointer;
        }

        .button-edit {
            background: #d97706;
        }

        .button-delete {
            background: #dc2626;
        }

        .button-secondary {
            background: #6b7280;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th,
        td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #e5e7eb;
        }

        tr:nth-child(even) {
            background: #f9fafb;
        }

        input,
        select {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 10px;
        }

        .search-form {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr auto;
            gap: 10px;
            align-items: end;
        }

        .actions {
            white-space: nowrap;
        }

        .errorlist {
            color: #dc2626;
        }

        .pagination-note {
            margin: 15px 0;
            color: #555;
        }
    </style>
</head>

<body>
    <nav>
        <a class="brand" href="{% url 'book_list' %}">
            Book Sales and Ratings
        </a>

        <div>
            <a href="{% url 'book_list' %}">All Books</a>
            <a href="{% url 'book_create' %}">Add Book</a>
        </div>
    </nav>

    <main class="container">
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
