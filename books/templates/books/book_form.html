{% extends "books/base.html" %}

{% block title %}
{{ heading }}
{% endblock %}

{% block content %}
<div class="card">
    <h1>{{ heading }}</h1>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button class="button" type="submit">
            {{ button_text }}
        </button>

        <a
            class="button button-secondary"
            href="{% url 'book_list' %}"
        >
            Cancel
        </a>
    </form>
</div>
{% endblock %}
